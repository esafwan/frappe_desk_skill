<div class="fd-block fd-kpi-row" data-state="loading">
	<h3 class="fd-title">{{title}}</h3>
	<div class="fd-state fd-loading" role="status" aria-label="Loading"><div class="fd-skeleton"></div></div>
	<div class="fd-state fd-ready"><div class="fd-tiles" data-role="tiles"></div></div>
	<div class="fd-state fd-empty-state"><p class="fd-muted" data-role="empty-text">No KPIs configured.</p></div>
	<div class="fd-state fd-error-state" role="alert"><p class="fd-error-text" data-role="error-text">Could not load data.</p><button type="button" class="fd-btn" data-role="retry">Retry</button></div>
</div>
