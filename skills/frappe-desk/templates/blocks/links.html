<div class="fd-block fd-links" data-state="loading">
	<h3 class="fd-title">{{title}}</h3>
	<div class="fd-state fd-ready"><div class="fd-rows" data-role="rows"></div></div>
	<div class="fd-state fd-empty-state"><p class="fd-muted" data-role="empty-text">No links configured.</p></div>
	<div class="fd-state fd-error-state" role="alert"><p class="fd-error-text">Could not load links.</p><button type="button" class="fd-btn" data-role="retry">Retry</button></div>
</div>
