<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview: {{title}}</title>
<style>
/* Frappe v16 (Espresso) default values; source: frappe/public/css/espresso/colors.css + legacy.css */
:root {
	--bg-color: #ffffff; --card-bg: #ffffff; --control-bg: #f3f3f3; --subtle-fg: #f3f3f3;
	--text-color: #171717; --text-muted: #525252; --text-light: #7c7c7c;
	--border-color: #ededed; --btn-primary: #171717; --green-500: #43ac79; --red-500: #e03434;
	--alert-text-danger: #c92a2a; --radius-md: 10px; --text-sm: 13px; --text-base: 14px; --text-lg: 16px;
	--font-stack: "Inter", -apple-system, "Segoe UI", sans-serif; color-scheme: light;
}
[data-theme="dark"] {
	--bg-color: #0f0f0f; --card-bg: #0f0f0f; --control-bg: #292929; --subtle-fg: #292929;
	--text-color: #f3f3f3; --text-muted: #999999; --text-light: #7a7a7a;
	--border-color: #242424; --btn-primary: #f3f3f3; --green-500: #117846; --red-500: #b03030;
	--alert-text-danger: #f09090; color-scheme: dark;
}
body { margin: 0; padding: 24px; background: var(--bg-color); color: var(--text-color); font-family: var(--font-stack); font-size: 14px; }
.bar { display: flex; gap: 16px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
.bar button, .bar select { font: inherit; padding: 4px 16px; background: var(--control-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 8px; height: 32px; }
#host { max-width: 960px; }
</style>
</head>
<body>
<div class="bar">
	<strong>{{title}}</strong>
	<button id="theme" type="button">Toggle light/dark</button>
	<label>State <select id="state"><option>ok</option><option>loading</option><option>empty</option><option>error</option></select></label>
</div>
<div id="host"></div>
<script>
const BLOCK = {{block_json}};
let STATE = new URLSearchParams(location.search).get("state") || "ok";
document.getElementById("state").value = STATE;
const SAMPLE_DATES = "2026-01-15 10:30:00";
const frappeStub = {
	call(opts) {
		if (STATE === "loading") return new Promise(() => {});
		if (STATE === "error") return Promise.reject(new Error("stub error"));
		const a = opts.args || {};
		let message;
		if (opts.method === "frappe.client.get_count") {
			if (STATE === "empty") message = 0;
			else { const f = a.filters; message = f && Object.keys(f).length ? 38 : 120; }
		} else if (opts.method === "frappe.client.get_list") {
			const fields = a.fields || [];
			if (STATE === "empty") message = [];
			else if (fields.some((f) => /^(sum|avg)\(/.test(f))) message = [{ value: 18450.5 }];
			else message = [1, 2, 3, 4, 5].slice(0, a.limit_page_length || 5).map((n) => {
				const r = { name: "DOC-000" + n };
				fields.forEach((f) => { if (f !== "name") r[f] = f === "modified" || f === "creation" ? SAMPLE_DATES : "Sample " + f + " " + n; });
				return r;
			});
		}
		return Promise.resolve({ message });
	},
	set_route() { console.log("set_route", Array.from(arguments)); },
	datetime: { comment_when() { return "2 hours ago"; } },
};
function render() {
	const host = document.getElementById("host");
	host.textContent = "";
	const holder = document.createElement("div");
	host.appendChild(holder);
	const shadow = holder.attachShadow({ mode: "open" });
	const style = document.createElement("style");
	style.textContent = BLOCK.style;
	const div = document.createElement("div");
	div.innerHTML = BLOCK.html;
	shadow.appendChild(div);
	shadow.appendChild(style);
	try {
		new Function("root_element", "frappe", "__", BLOCK.script)(shadow, frappeStub, (s) => s);
	} catch (e) { console.error(e); }
}
document.getElementById("theme").addEventListener("click", () => {
	const r = document.documentElement;
	r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark";
});
document.getElementById("state").addEventListener("change", (e) => { STATE = e.target.value; render(); });
render();
</script>
</body>
</html>
